$kind: http-example
request:
  url: "{{baseUrl}}/api/scores/:id"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: string
  body:
    type: json
    content: |-
      {
        "value": 7.150284487852049
      }
response:
  statusCode: 401
  statusText: Unauthorized
  body:
    type: text
    content: ""
order: 3000
