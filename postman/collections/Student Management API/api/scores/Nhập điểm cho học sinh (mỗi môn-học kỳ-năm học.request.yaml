$kind: http-request
name: Nhập điểm cho học sinh (mỗi môn/học kỳ/năm học một điểm)
description: ""
url: "{{baseUrl}}/api/scores"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "studentId": "str",
      "subjectId": "string",
      "schoolYear": "1872-3076",
      "semester": 1,
      "value": 5.823513777040013
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "studentId": {
          "type": "string",
          "minLength": 1
        },
        "subjectId": {
          "type": "string",
          "minLength": 1
        },
        "semester": {
          "type": "integer",
          "minimum": 1,
          "maximum": 2,
          "format": "int32"
        },
        "schoolYear": {
          "type": "string",
          "minLength": 1,
          "pattern": "^\\d{4}-\\d{4}$"
        },
        "value": {
          "type": "number",
          "minimum": 0,
          "maximum": 10
        }
      },
      "required": [
        "studentId",
        "subjectId",
        "schoolYear"
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Nhập điểm cho học sinh (mỗi môn-học kỳ-năm học.resources/examples
order: 1000
