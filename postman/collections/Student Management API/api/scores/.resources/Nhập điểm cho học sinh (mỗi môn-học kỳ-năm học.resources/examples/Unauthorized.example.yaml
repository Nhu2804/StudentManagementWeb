$kind: http-example
request:
  url: "{{baseUrl}}/api/scores"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "studentId": "str",
        "subjectId": "string",
        "schoolYear": "1872-3076",
        "semester": 1,
        "value": 5.823513777040013
      }
response:
  statusCode: 401
  statusText: Unauthorized
  body:
    type: text
    content: ""
order: 3000
