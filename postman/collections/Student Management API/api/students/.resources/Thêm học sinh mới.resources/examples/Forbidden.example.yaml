$kind: http-example
request:
  url: "{{baseUrl}}/api/students"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "fullName": "string",
        "classId": "string",
        "dateOfBirth": "1982-09-11",
        "gender": 2,
        "email": "JL@Os_)G$3yt",
        "phone": "string",
        "address": "string"
      }
response:
  statusCode: 403
  statusText: Forbidden
  body:
    type: text
    content: ""
order: 4000
