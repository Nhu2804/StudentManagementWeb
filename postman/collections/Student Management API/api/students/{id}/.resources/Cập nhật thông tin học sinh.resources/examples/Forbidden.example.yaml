$kind: http-example
request:
  url: "{{baseUrl}}/api/students/:id"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: string
  body:
    type: json
    content: |-
      {
        "fullName": "string",
        "classId": "string",
        "dateOfBirth": "1970-03-21",
        "gender": 2,
        "email": "xZ@.tO(/",
        "phone": "string",
        "address": "string"
      }
response:
  statusCode: 403
  statusText: Forbidden
  body:
    type: text
    content: ""
order: 4000
