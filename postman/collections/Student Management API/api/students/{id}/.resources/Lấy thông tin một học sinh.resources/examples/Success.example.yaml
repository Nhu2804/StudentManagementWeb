$kind: http-example
request:
  url: "{{baseUrl}}/api/students/:id"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: string
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "string",
        "code": "string",
        "fullName": "string",
        "dateOfBirth": "2016-08-22",
        "gender": 2,
        "email": "string",
        "phone": "string",
        "address": "string",
        "classId": "string",
        "className": "string"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "code": {
            "type": "string"
          },
          "fullName": {
            "type": "string"
          },
          "dateOfBirth": {
            "type": "string",
            "format": "date"
          },
          "gender": {
            "type": "integer",
            "enum": [
              1,
              2
            ],
            "description": ""
          },
          "email": {
            "type": "string"
          },
          "phone": {
            "type": "string"
          },
          "address": {
            "type": "string"
          },
          "classId": {
            "type": "string"
          },
          "className": {
            "type": "string"
          }
        }
      }
order: 1000
