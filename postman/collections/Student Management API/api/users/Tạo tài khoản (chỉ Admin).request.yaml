$kind: http-request
description: ""
url: "{{baseUrl}}/api/users"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "username": "Y5-RDGMtpt",
      "password": "string",
      "fullName": "string",
      "role": "string",
      "studentId": "string"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "username": {
          "type": "string",
          "minLength": 3,
          "maxLength": 50,
          "pattern": "^[a-zA-Z0-9._-]+$"
        },
        "password": {
          "type": "string",
          "minLength": 6
        },
        "fullName": {
          "type": "string",
          "minLength": 0,
          "maxLength": 150
        },
        "role": {
          "type": "string"
        },
        "studentId": {
          "type": "string"
        }
      },
      "required": [
        "username",
        "password",
        "fullName"
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Tạo tài khoản (chỉ Admin).resources/examples
order: 1000
