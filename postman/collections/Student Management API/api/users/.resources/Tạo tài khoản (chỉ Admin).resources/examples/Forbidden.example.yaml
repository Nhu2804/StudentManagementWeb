$kind: http-example
request:
  url: "{{baseUrl}}/api/users"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "username": "Y5-RDGMtpt",
        "password": "string",
        "fullName": "string",
        "role": "string",
        "studentId": "string"
      }
response:
  statusCode: 403
  statusText: Forbidden
  body:
    type: text
    content: ""
order: 4000
