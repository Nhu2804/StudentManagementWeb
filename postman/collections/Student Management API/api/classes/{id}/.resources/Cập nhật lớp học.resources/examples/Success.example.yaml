$kind: http-example
request:
  url: "{{baseUrl}}/api/classes/:id"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: string
  body:
    type: json
    content: |-
      {
        "name": "string",
        "schoolYear": "1925-7028",
        "grade": 7
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "string",
        "name": "string",
        "grade": 3030,
        "schoolYear": "string",
        "studentCount": 1927
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "grade": {
            "type": "integer",
            "format": "int32"
          },
          "schoolYear": {
            "type": "string"
          },
          "studentCount": {
            "type": "integer",
            "format": "int32"
          }
        }
      }
order: 1000
