$kind: http-request
description: ""
url: "{{baseUrl}}/api/classes/:id"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: string
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "name": "string",
      "schoolYear": "1925-7028",
      "grade": 7
    }
  $type: |-
    {
      "allOf": [
        {
          "type": "object",
          "properties": {
            "name": {
              "type": "string",
              "minLength": 0,
              "maxLength": 50
            },
            "grade": {
              "type": "integer",
              "minimum": 1,
              "maximum": 12,
              "format": "int32"
            },
            "schoolYear": {
              "type": "string",
              "minLength": 1,
              "pattern": "^\\d{4}-\\d{4}$"
            }
          },
          "required": [
            "name",
            "schoolYear"
          ]
        },
        {
          "type": "object"
        }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Cập nhật lớp học.resources/examples
order: 3000
