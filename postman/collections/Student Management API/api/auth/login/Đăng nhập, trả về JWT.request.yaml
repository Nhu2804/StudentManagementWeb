$kind: http-request
description: ""
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "username": "Admin",
      "password": "Admin@123"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "username": {
          "type": "string",
          "minLength": 1
        },
        "password": {
          "type": "string",
          "minLength": 1
        }
      },
      "required": [
        "username",
        "password"
      ]
    }
scripts:
  - type: afterResponse
    code: pm.collectionVariables.set("bearerToken", pm.response.json().token);
    language: text/javascript
settings: {}
examples: ./.resources/Đăng nhập, trả về JWT.resources/examples
order: 1000
